# @package _global_
# 70/10/20/55*53=40015 steps
general:
    name : 'enzyme'
    gpus : 1
    wandb: 'online'
    resume: null            # If resume, path to ckpt file from outputs directory in main directory
    test_only: null
    check_val_every_n_epochs: 150 #19
    sample_every_val: 1
    samples_to_generate: 40
    samples_to_save: 9
    chains_to_save: 1
    final_model_samples_to_generate: 120
    final_model_samples_to_save: 30
    final_model_chains_to_save: 20
    sample_steps: 1000
train:
    n_epochs: 755
    batch_size: 8
    save_model: True
sample:
    time_distortion: 'identity'
    omega: 0
    eta: 0
model:
    transition: 'absorbfirst'
    n_layers: 8
    rrwp_steps: 20

    # Do not set hidden_mlp_E, dim_ffE too high, computing large tensors on the edges is costly
    hidden_mlp_dims: { 'X': 128, 'E': 64, 'y': 128 }

    # The dimensions should satisfy dx % n_head == 0
    hidden_dims: { 'dx': 256, 'de': 64, 'dy': 64, 'n_head': 8, 'dim_ffX': 256, 'dim_ffE': 64, 'dim_ffy': 256 }
