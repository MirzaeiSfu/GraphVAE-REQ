# Generic attributed-graph encoder.  The prepared bundle metadata overwrites
# node_feature_dims/edge_feature_dims before model construction.  Select any
# prepared dataset with: dataset.name MUTAG (or PTC/AIDS/QM9/PROTEINS/GRID/
# LOBSTER/TRIANGULAR_GRID).
out_dir: results
metric_best: loss
metric_agg: argmin
accelerator: "cuda:0"
seed: 0
dataset:
  format: PyG-GraphVAEReq
  name: GRID
  dir: datasets/graphvae_req
  task: graph
  task_type: regression
  split_mode: standard
  transductive: False
  aug_edge: True
  node_encoder: True
  node_encoder_name: MultiCategoricalNode
  node_encoder_num_types: 1
  node_feature_dims: [1]
  edge_encoder: True
  edge_encoder_name: MultiCategoricalEdge
  edge_encoder_num_types: 2
  edge_feature_dims: [2]
  add_virtual_node_edge: False
  subgraph: False
train:
  mode: pretrain_encoder
  batch_size: 32
  ensemble_repeat: 1
  ensemble_mode: none
  eval_period: 25
  enable_ckpt: True
  ckpt_best: True
  ckpt_clean: False
  ckpt_period: 25
  pretrain:
    atom_bond_only: False
    mask_node_prob: 0.0
    mask_edge_prob: 0.0
    mask_label_prob: 0.0
    recon: all
    original_task: False
    input_target: False
    node_factor: 1.0
    edge_factor: 1.0
    graph_factor: 0.0
model:
  type: GraphTransformerStructureEncoder
  loss_fun: l1
posenc_RRWP:
  enable: True
  ksteps: 16
encoder:
  model_type: GraphTransformerStructureEncoder
  in_dim: 48
  prefix_dim: 96
  posenc_in_dim: 16
  posenc_in_dim_edge: 16
  posenc_dim: 48
  hid_dim: 96
  out_dim: 32
  node_attr_dim: 0
  use_time: False
  temb_dim: 0
  num_heads: 4
  num_layers: 5
  dropout: 0.2
  attn_dropout: 0.5
  residual: True
  layer_norm: False
  batch_norm: True
  act: relu
  norm_e: True
  O_e: True
  ff_e: False
  update_e: True
  force_undirected: True
  pool: add
  pool_edge: True
  pool_vn: False
  post_pool: False
  prefix_type: add_virtual
  label_embed_type: add_virtual
  num_tasks: 1
  task_type: regression
  node_encoder_name: MultiCategoricalNode
  node_encoder_num_types: 1
  node_feature_dims: [1]
  edge_encoder_name: MultiCategoricalEdge
  edge_encoder_num_types: 2
  edge_feature_dims: [2]
  add_virtual_node_edge: False
  attn:
    clamp: 5.0
    act: relu
    full_attn: True
    edge_enhance: True
    O_e: True
    norm_e: True
    fwl: False
    signed_sqrt: True
    score_act: True
    attn_product: mul
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1.0e-5
  base_lr: 1.0e-3
  max_epoch: 200
  num_warmup_epochs: 10
  scheduler: cosine_with_warmup
  min_lr: 1.0e-6
