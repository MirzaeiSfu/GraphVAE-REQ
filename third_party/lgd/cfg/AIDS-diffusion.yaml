out_dir: results
metric_best: loss
metric_agg: argmin
accelerator: "cuda:0"
seed: 123
wandb:
  use: False
  project: AIDS
  name: AIDS
dataset:
  format: PyG-TUDataset
  name: AIDS
  task: graph
  task_type: regression
  split_mode: graphvae_paper_70_10_20
  split: [0.7, 0.1, 0.2]
  transductive: False
  node_encoder: True
  node_encoder_name: TypeDictNode
  node_encoder_num_types: 38
  edge_encoder: True
  edge_encoder_name: TypeDictEdge
  edge_encoder_num_types: 4
  add_virtual_node_edge: False
  subgraph: False
  methods: [degree, cluster, orbit, spectral]
  kernels: {degree: tv, cluster: tv, orbit: tv, spectral: tv}
train:
  mode: tu_unconditional
  batch_size: 32
  eval_period: 50
  start_eval_epoch: 0
  enable_ckpt: True
  ckpt_best: False
  ckpt_clean: False
  pretrain:
    mask_node_prob: 0.0
    mask_edge_prob: 0.0
    mask_label_prob: 0.0
    recon: none
    original_task: False
    input_target: False
    node_factor: 0.0
    edge_factor: 0.0
    graph_factor: 0.0
model:
  type: LatentDiffusion
  loss_fun: l1
  edge_decoding: dot
  graph_pooling: add
posenc_RRWP:
  enable: True
  ksteps: 16
encoder:
  type: GraphTransformerStructureEncoder
  model_type: GraphTransformerStructureEncoder
  in_dim: 48
  prefix_dim: 96
  posenc_in_dim: 16
  posenc_in_dim_edge: 16
  posenc_dim: 48
  hid_dim: 96
  out_dim: 32
  node_attr_dim: 4
  use_time: False
  temb_dim: 0
  num_heads: 4
  num_layers: 5
  dropout: 0.2
  attn_dropout: 0.5
  residual: True
  layer_norm: False
  batch_norm: True
  act: relu
  norm_e: True
  O_e: True
  ff_e: False
  update_e: True
  pool: add
  pool_edge: True
  pool_vn: False
  post_pool: False
  prefix_type: add_virtual
  label_embed_type: add_virtual
  num_task: 1
  task_type: regression
  node_encoder_num_types: 38
  edge_encoder_num_types: 4
  add_virtual_node_edge: False
  attn: {clamp: 5., act: relu, full_attn: True, edge_enhance: True, O_e: True, norm_e: True, fwl: False, signed_sqrt: True, score_act: True}
dt:
  in_dim: 32
  hid_dim: 64
  out_dim: 32
  use_time: True
  temb_dim: 64
  cond_dim: 32
  num_heads: 8
  num_layers: 4
  self_attn: True
  dropout: 0.05
  attn_dropout: 0.25
  residual: True
  layer_norm: True
  batch_norm: False
  act: relu
  norm_e: True
  O_e: True
  ff_e: False
  pool: add
  condition_list: ['unconditional']
diffusion:
  conditioning_key: crossattn
  hid_dim: 32
  cond_stage_key: unconditional
  first_stage_config: results/AIDS-encoder/123/ckpt/199.ckpt  # change to actual ckpt
  cond_stage_config: __is_first_stage__
  node_factor: 1.0
  edge_factor: 1.0
  graph_factor: 0.0
  task_factor: 0.0
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1e-5
  base_lr: 1e-3
  max_epoch: 3182  # ~140k grad steps (1400 train graphs / batch 32 = 44 steps/epoch), matching GraphVAE-REQ/DeFoG's AIDS step budget
  num_warmup_epochs: 50
  scheduler: cosine_with_warmup
  min_lr: 1e-6
