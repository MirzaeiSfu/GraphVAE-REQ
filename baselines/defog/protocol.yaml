dataset:
  name: PROTEINS
  source: dgl.data.GINDataset
  source_name: PROTEINS
  total_graphs_after_filter: 1045
  max_nodes_exclusive: 100
  feature_schema: default|export=decoded_node
  node_feature_dim: 3
  edge_feature_dim: 0

split:
  algorithm: python_random.Random.shuffle
  seed: 123
  train_fraction: 0.7
  validation_fraction: 0.1
  test_fraction: 0.2
  counts:
    train: 731
    validation: 104
    test: 210
  index_sha256: d924d80e676c0118be4d5915feacab652528fc6dce60e8350de0267b6dfcce0f

generation:
  graph_count: 210
  seed: 12345
  invalid_graph_policy: reject

normalization:
  connected_components: deterministic_largest_component
  self_loops: reject
  duplicate_directed_edges: reject
  undirected_edges: require_both_directions

checkpoint_selection:
  split: validation
  held_out_test_access: forbidden

evaluation:
  command: ggm-eval evaluate-trained
  dataset: PROTEINS
  encoder: graphcl_gin
  encoder_seeds: [0, 1, 2]
  max_graphs: 210
  feature_mode: decoded_node
  feature_schema: default|export=decoded_node

native_configs:
  graphvae:
    path: configs/cluster_tests/proteins_table2_00_graphvae.yaml
    expected:
      data.dataset: PROTEINS
      data.use_feature: true
      data.split_mode: paper_70_10_20
      data.split_seed: 123
      data.train_fraction: 0.7
      data.val_fraction: 0.1
  defog_dataset:
    path: configs/dataset/proteins.yaml
    expected:
      name: proteins
      datadir: data/proteins/
  defog_experiment:
    path: configs/experiment/proteins.yaml
    expected:
      general.final_model_samples_to_generate: 210
      train.n_epochs: 1307
      train.batch_size: 16
