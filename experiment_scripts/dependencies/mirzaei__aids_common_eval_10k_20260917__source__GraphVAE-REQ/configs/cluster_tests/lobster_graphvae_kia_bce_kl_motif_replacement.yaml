# LOBSTER GraphVAE motif replacement for Kia's GraphVAE-MM statistics.
#
# Preserved from Kia's LOBSTER setup:
#   - FC GraphVAE architecture and standard-normal generation prior
#   - adjacency BCE weight 40 and KL weight 2000
# Replaced/added intentionally:
#   - no GraphVAE-MM transition/degree/triangle statistics (model=GraphVAE)
#   - original FactorBase motif loss, plus node/edge feature supervision
# Auxiliary weights target comparable late-training contributions (~1 each)
# based on observed raw medians: node=0.367, edge=0.125, motif=1.327.

data:
  dataset: LOBSTER
  use_feature: true
  bfsOrdering: true
  bfs_strategy: legacy_first_component
  directed: true
  database_name: lobster_undir_feat_snap_85093d
  graph_type: homogeneous
  graph_index_start: null
  graph_index_end: null
  data_dir: null
  lobster_feature_schema: old_v1
  split_mode: paper_70_10_20
  split_seed: 123
  train_fraction: 0.7
  val_fraction: 0.1
  seed: 0
  deterministic: true
  deterministic_warn_only: false

model:
  model: GraphVAE
  encoder_type: AvePool
  decoder: FC
  graphEmDim: 1024
  beta: null

experiment:
  epoch_number: 20000
  Vis_step: 1000
  redraw: false
  lr: 0.0003
  train_batch_size: 200
  task: graphGeneration

motif:
  motif_loss: true
  use_syntactic_literal_rules: false
  syntactic_literal_rule_mode: original
  motif_loss_mode: calibrated_gaussian
  motif_temperature_start: 1.0
  motif_temperature_end: 1.0
  motif_temperature_anneal_start_frac: 1.0
  motif_temperature_guard_ratio: 0.0
  motif_temperature_guard_relax_factor: 1.05
  motif_temperature_guard_sharpen_factor: 0.995
  rule_prune: true
  motif_batch_size: 50000
  prepare_motif_cache_only: false

loss:
  alpha_kernel_cost: 1.0
  use_graphvae_mm_bce_kl_weights: true
  alpha_node_feat: 3.0
  alpha_edge_feat: 8.0
  alpha_motif_loss: 1.0
  alpha_syntactic_literal_motif_loss: 1.0
  alpha_adj_recon: 0.0

runtime:
  run_label: lobster-graphvae-kia-bce-kl-motif-replacement
  graph_save_path: runs/cluster_tests/lobster_graphvae_kia_bce_kl_motif_replacement
  dataset_cache_dir: runs/cluster_tests/lobster_old_features/dataset_cache
  disable_dataset_cache: false
  motif_cache_dir: cache_motifs_old_lobster
  PATH: model
  UseGPU: true
  device: cuda:0
  plot_testGraphs: true
  ideal_Evalaution: false
  keep_best_validation_mmd: true
  best_validation_mmd_metric: table3_priority
  save_validation_checkpoints: false
  checkpoint_interval_epochs: 1000
  third_party_eval: true
  third_party_eval_repeats: 10
  third_party_eval_max_graphs: 1000
  third_party_eval_seed: 0
  third_party_eval_device: same
  third_party_eval_structural_features: true
  third_party_eval_json_filename: graph_realism_random_gin.json
  third_party_eval_strict: true
  tiny_overfit: false
  tiny_overfit_size: 32
  interactive: false
  sanity_check: false
  sanity_check_only: false
