# QM9 GraphVAE base configuration for validation Attr-F1PR optimization.
# The optimizer changes only alpha_node_feat and alpha_edge_feat by default.

data:
  dataset: QM9
  use_feature: true
  bfsOrdering: true
  bfs_strategy: legacy_first_component
  directed: true
  database_name: qm9_experiment
  graph_type: homogeneous
  graph_index_start: null
  graph_index_end: null
  data_dir: null
  split_mode: paper_70_10_20
  split_seed: 123
  dataset_loader_seed: 0
  train_fraction: 0.7
  val_fraction: 0.1
  seed: 0
  deterministic: true
  deterministic_warn_only: false

model:
  model: GraphVAE
  encoder_type: AvePool
  decoder: FC
  graphEmDim: 1024
  beta: null

experiment:
  epoch_number: 20000
  Vis_step: 1000
  redraw: false
  lr: 0.0003
  train_batch_size: 200
  task: graphGeneration

motif:
  motif_loss: false
  motif_output_mode: count
  motif_loss_mode: abs_log_ratio
  motif_temperature_start: 1.0
  motif_temperature_end: 0.5
  motif_temperature_anneal_start_frac: 0.5
  rule_prune: false
  motif_batch_size: 50000

loss:
  alpha_kernel_cost: 1.0
  alpha_node_feat: 1.0
  alpha_edge_feat: 1.0
  alpha_motif_loss: 0.0
  use_graphvae_mm_bce_kl_weights: false
  alpha_adj_recon: 0.0

runtime:
  graph_save_path: null
  dataset_cache_dir: cache_datasets
  motif_cache_dir: null
  PATH: model
  UseGPU: true
  device: cuda
  plot_testGraphs: false
  ideal_Evalaution: false
  keep_best_validation_mmd: true
  best_validation_mmd_metric: normalized_table2_table3
  save_validation_checkpoints: false
  checkpoint_interval_epochs: 1000
  third_party_eval: false
  tiny_overfit: false
  tiny_overfit_size: 32
  interactive: false
  sanity_check: false
  sanity_check_only: false
