# Triangular Grid Table 2 GraphVAE-MM run with Kia-MM
# graph-statistics loss. In main.py, TRIANGULAR_GRID GraphVAE-MM uses
# alpha=[1,1,1,1,1,1,1,1,50,2000]: eight graph-statistic losses each have
# weight 1.

data:
  dataset: TRIANGULAR_GRID
  use_feature: true
  bfsOrdering: true
  bfs_strategy: legacy_first_component
  directed: true
  database_name: triangular_grid_experiment
  graph_type: homogeneous
  graph_index_start: null
  graph_index_end: null
  data_dir: null
  split_mode: paper_70_10_20

model:
  model: GraphVAE-MM
  encoder_type: AvePool
  decoder: FC
  graphEmDim: 1024
  beta: null

experiment:
  epoch_number: 20000
  Vis_step: 1000
  redraw: false
  lr: 0.0003
  train_batch_size: 200
  task: graphGeneration

motif:
  motif_loss: false
  use_syntactic_literal_rules: true
  syntactic_literal_rule_mode: both
  motif_loss_mode: abs_log_ratio
  motif_temperature_start: 1.0
  motif_temperature_end: 0.5
  motif_temperature_anneal_start_frac: 0.5
  rule_prune: false
  motif_batch_size: 50000

loss:
  alpha_kernel_cost: 1.0
  alpha_node_feat: 40.0
  alpha_edge_feat: 40.0
  alpha_motif_loss: 0.0
  alpha_adj_recon: 0.0

runtime:
  run_label: triangular-grid-table2-graphvae-mm
  graph_save_path: runs/table2_reproduction/triangular_grid_graphvae_mm
  dataset_cache_dir: runs/table2_reproduction/dataset_cache
  motif_cache_dir: null
  PATH: model
  UseGPU: true
  device: cuda:0
  plot_testGraphs: true
  ideal_Evalaution: false
  keep_best_validation_mmd: true
  best_validation_mmd_metric: normalized_table2_table3
  save_validation_checkpoints: false
  third_party_eval: true
  tiny_overfit: false
  tiny_overfit_size: 32
  interactive: false
  sanity_check: false
  sanity_check_only: false
