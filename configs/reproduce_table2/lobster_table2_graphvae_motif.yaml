# Lobster Table 2 motif run: GraphVAE without Kia-MM stats loss, adding
# calibrated Gaussian motif-count loss with motif alpha 0.1. BCE/KL keep the
# plain GraphVAE weights [1,1].

data:
  dataset: LOBSTER
  use_feature: true
  bfsOrdering: true
  bfs_strategy: legacy_first_component
  directed: true
  database_name: lobster_undir_feat_snap_85093d_cfg410000000
  graph_type: homogeneous
  graph_index_start: null
  graph_index_end: null
  data_dir: null
  split_mode: paper_70_10_20

model:
  model: GraphVAE
  encoder_type: AvePool
  decoder: FC
  graphEmDim: 1024
  beta: null

experiment:
  epoch_number: 10000
  Vis_step: 1000
  redraw: false
  lr: 0.0003
  train_batch_size: 200
  task: graphGeneration

motif:
  motif_loss: true
  use_syntactic_literal_rules: true
  syntactic_literal_rule_mode: both
  motif_loss_mode: calibrated_gaussian
  motif_temperature_start: 1.0
  motif_temperature_end: 0.5
  motif_temperature_anneal_start_frac: 0.5
  rule_prune: true
  motif_batch_size: 50000

loss:
  alpha_kernel_cost: 1.0
  alpha_node_feat: 1.0
  alpha_edge_feat: 1.0
  alpha_motif_loss: 0.1
  alpha_syntactic_literal_motif_loss: 0.1
  alpha_adj_recon: 0.0

runtime:
  run_label: lobster-table2-graphvae-motif
  graph_save_path: runs/table2_reproduction/lobster_graphvae_motif
  dataset_cache_dir: runs/table2_reproduction/dataset_cache
  motif_cache_dir: null
  PATH: model
  UseGPU: true
  device: cuda:0
  plot_testGraphs: true
  ideal_Evalaution: false
  keep_best_validation_mmd: false
  best_validation_mmd_metric: normalized_table2
  save_validation_checkpoints: false
  tiny_overfit: false
  tiny_overfit_size: 32
  interactive: false
  sanity_check: false
  sanity_check_only: false
