# Gate 4 qualification-only GraphVAE configuration. Never use as a
# production budget or as evidence for QM9 model quality.
data:
  dataset: LOBSTER
  use_feature: true
  bfsOrdering: true
  bfs_strategy: legacy_first_component
  directed: true
  database_name: lobster_undir_feat_snap_85093d_cfg410000000
  graph_type: homogeneous
  lobster_feature_schema: optimal_v2
  split_mode: paper_70_10_20
  split_seed: 123
  dataset_loader_seed: 0
  train_fraction: 0.7
  val_fraction: 0.1
  seed: 0
  deterministic: true
  deterministic_warn_only: false

model:
  model: GraphVAE
  encoder_type: AvePool
  decoder: FC
  graphEmDim: 64
  beta: null

experiment:
  epoch_number: 2
  Vis_step: 1
  redraw: false
  lr: 0.0003
  train_batch_size: 8
  task: graphGeneration

motif:
  motif_loss: false

loss:
  alpha_kernel_cost: 1.0
  alpha_node_feat: 1.0
  alpha_edge_feat: 1.0
  alpha_motif_loss: 0.0
  use_graphvae_mm_bce_kl_weights: false
  alpha_adj_recon: 0.0

runtime:
  graph_save_path: null
  dataset_cache_dir: cache_datasets
  disable_dataset_cache: false
  require_existing_dataset_cache: true
  UseGPU: true
  device: cuda:0
  plot_testGraphs: false
  ideal_Evalaution: false
  skip_final_evaluation: true
  third_party_eval: false
  tiny_overfit: false
  sanity_check: false
  sanity_check_only: false

bayesian_optimization_qualification:
  expected_total_graphs: 100
  max_graphs: 8
  generation_batch_size: 4
  training_timeout_seconds: 600
  evaluation_timeout_seconds: 600
  termination_grace_seconds: 10
