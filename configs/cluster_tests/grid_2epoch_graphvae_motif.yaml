# Lightweight cluster smoke test for the GRID dataset with motif loss enabled.
#
# This tests the controller motif-cache preparation path plus worker-side motif
# cache loading. Keep this tiny; it is for pipeline validation, not reporting.

data:
  dataset: GRID
  use_feature: true
  bfsOrdering: true
  bfs_strategy: legacy_first_component
  directed: true
  database_name: grid_undir_feat_snap_7a58e6
  graph_type: homogeneous
  graph_index_start: null
  graph_index_end: null
  data_dir: null
  split_mode: paper_70_10_20

model:
  model: GraphVAE
  encoder_type: AvePool
  decoder: FC
  graphEmDim: 128
  beta: null

experiment:
  epoch_number: 2
  Vis_step: 1
  redraw: false
  lr: 0.0003
  train_batch_size: 32
  task: graphGeneration

motif:
  motif_loss: true
  use_syntactic_literal_rules: true
  syntactic_literal_rule_mode: both
  motif_loss_mode: calibrated_gaussian
  motif_temperature_start: 1.0
  motif_temperature_end: 0.5
  motif_temperature_anneal_start_frac: 0.5
  rule_prune: false
  motif_batch_size: 2000

loss:
  alpha_kernel_cost: 1.0
  alpha_node_feat: 0.0
  alpha_edge_feat: 0.0
  alpha_motif_loss: 1.0
  use_graphvae_mm_bce_kl_weights: true
  alpha_syntactic_literal_motif_loss: 1.0
  edge_count_loss: false
  edge_count_loss_mode: abs_log_ratio
  alpha_edge_count: 0.0
  alpha_adj_recon: 0.0

runtime:
  run_label: grid-2epoch-cluster-smoke-motif
  graph_save_path: runs/cluster_smoke_grid_motif/grid_2epoch_graphvae_motif
  dataset_cache_dir: cache_datasets
  motif_cache_dir: null
  PATH: model
  UseGPU: true
  device: cuda:0
  plot_testGraphs: false
  ideal_Evalaution: false
  keep_best_validation_mmd: false
  best_validation_mmd_metric: normalized_table2
  save_validation_checkpoints: false
  tiny_overfit: false
  tiny_overfit_size: 32
  interactive: false
  sanity_check: false
  sanity_check_only: false
