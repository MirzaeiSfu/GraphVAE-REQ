# TRIANGULAR_GRID Table 2 run 01: GraphVAE baseline.
# This is the closest Table-2-style GraphVAE reproduction: no GraphVAE-MM
# graph-statistics loss, no motif loss, and no direct feature/count auxiliaries.

data:
  dataset: TRIANGULAR_GRID
  use_feature: true
  bfsOrdering: true
  bfs_strategy: legacy_first_component
  directed: true
  database_name: triangular_grid_undir_feat_snap_ce92ed_cfg410000000
  graph_type: homogeneous
  graph_index_start: null
  graph_index_end: null
  data_dir: null
  split_mode: paper_70_10_20
  split_seed: 123
  train_fraction: 0.7
  val_fraction: 0.1

model:
  model: GraphVAE
  encoder_type: AvePool
  decoder: FC
  graphEmDim: 1024
  beta: null

experiment:
  epoch_number: 20000
  Vis_step: 1000
  redraw: false
  lr: 0.0003
  train_batch_size: 200
  task: graphGeneration

motif:
  motif_loss: false
  use_syntactic_literal_rules: false
  syntactic_literal_rule_mode: original
  motif_loss_mode: abs_log_ratio
  motif_temperature_start: 1.0
  motif_temperature_end: 1.0
  motif_temperature_anneal_start_frac: 1.0
  rule_prune: false
  motif_batch_size: 50000
  prepare_motif_cache_only: false

loss:
  alpha_kernel_cost: 1.0
  alpha_node_feat: 1.0
  alpha_edge_feat: 1.0
  alpha_motif_loss: 0.0
  alpha_syntactic_literal_motif_loss: 0.0
  alpha_adj_recon: 0.0

runtime:
  run_label: triangular-grid-table2-01-graphvae
  graph_save_path: runs/cluster_tests/triangular_grid_table2/01_graphvae
  dataset_cache_dir: runs/cluster_tests/triangular_grid_table2/dataset_cache
  disable_dataset_cache: false
  motif_cache_dir: null
  PATH: model
  UseGPU: true
  device: cuda:0
  plot_testGraphs: true
  ideal_Evalaution: false
  keep_best_validation_mmd: false
  best_validation_mmd_metric: normalized_table2
  save_validation_checkpoints: false
  third_party_eval: false
  third_party_eval_repeats: 10
  third_party_eval_max_graphs: 1000
  third_party_eval_seed: 0
  third_party_eval_device: same
  third_party_eval_structural_features: true
  third_party_eval_json_filename: graph_realism_random_gin.json
  third_party_eval_strict: true
  tiny_overfit: false
  tiny_overfit_size: 32
  interactive: false
  sanity_check: false
  sanity_check_only: false
