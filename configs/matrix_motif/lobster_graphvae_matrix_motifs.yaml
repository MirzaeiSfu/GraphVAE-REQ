# LOBSTER GraphVAE experiment retaining every final motif-chain matrix.
#
# This starts from the existing LOBSTER Table 2 GraphVAE + motif setup, but
# motif_output_mode=matrix replaces each scalar motif count with a padded
# [N_max, N_max] matrix. Every motif matrix receives the same calibrated
# Gaussian statistic loss that GraphVAE-MM applies independently to P^1,...,P^5.

data:
  dataset: LOBSTER
  use_feature: true
  bfsOrdering: true
  bfs_strategy: legacy_first_component
  directed: true
  database_name: lobster_undir_feat_snap_85093d
  graph_type: homogeneous
  graph_index_start: null
  graph_index_end: null
  data_dir: null
  split_mode: paper_70_10_20
  split_seed: 123
  train_fraction: 0.7
  val_fraction: 0.1
  seed: 0
  deterministic: true
  deterministic_warn_only: false

model:
  model: GraphVAE
  encoder_type: AvePool
  decoder: FC
  graphEmDim: 1024
  beta: null

experiment:
  epoch_number: 20000
  Vis_step: 1000
  redraw: false
  lr: 0.0003
  train_batch_size: 200
  task: graphGeneration

motif:
  motif_loss: true
  motif_output_mode: matrix
  use_syntactic_literal_rules: false
  syntactic_literal_rule_mode: original
  # Matrix mode uses the Kia-MM calibrated Gaussian objective exclusively.
  motif_loss_mode: calibrated_gaussian
  motif_temperature_start: 1.0
  motif_temperature_end: 1.0
  motif_temperature_anneal_start_frac: 1.0
  rule_prune: true
  # Matrix outputs are much larger than scalar counts, so use smaller chunks.
  motif_batch_size: 64
  prepare_motif_cache_only: false

loss:
  alpha_kernel_cost: 1.0
  alpha_node_feat: 1.0
  alpha_edge_feat: 1.0
  # Shared weight applied after globally averaging the per-motif matrix losses.
  alpha_motif_loss: 1.0
  alpha_syntactic_literal_motif_loss: 0.0
  alpha_adj_recon: 0.0

runtime:
  run_label: lobster-graphvae-matrix-motifs
  graph_save_path: runs/matrix_motif/lobster_graphvae_matrix_motifs
  dataset_cache_dir: runs/cluster_tests/lobster_table2/dataset_cache
  disable_dataset_cache: false
  motif_cache_dir: null
  PATH: model
  UseGPU: true
  device: cuda:0
  plot_testGraphs: true
  ideal_Evalaution: false
  keep_best_validation_mmd: true
  best_validation_mmd_metric: table3_priority
  save_validation_checkpoints: false
  checkpoint_interval_epochs: 1000
  third_party_eval: true
  third_party_eval_repeats: 10
  third_party_eval_max_graphs: 1000
  third_party_eval_seed: 0
  third_party_eval_device: same
  third_party_eval_structural_features: true
  third_party_eval_json_filename: graph_realism_random_gin.json
  third_party_eval_strict: true
  tiny_overfit: false
  tiny_overfit_size: 32
  interactive: false
  sanity_check: false
  sanity_check_only: false
