data:
  dataset: GRID
  use_feature: false
  bfsOrdering: true
  bfs_strategy: legacy_first_component
  directed: false
  database_name: grid_undir_feat_snap_7a58e6_multi
  graph_type: homogeneous
  graph_index_start: null
  graph_index_end: null
  data_dir: null
  split_mode: paper_70_10_20
  split_seed: 123
  dataset_loader_seed: 123
  train_fraction: 0.7
  val_fraction: 0.1
  seed: 0
  deterministic: true
  deterministic_warn_only: false

model:
  model: GraphVAE
  encoder_type: AvePool
  decoder: FC
  graphEmDim: 128
  beta: null
  correct_reparameterization: false

experiment:
  epoch_number: 20000
  Vis_step: 1000
  redraw: false
  lr: 0.0003
  train_batch_size: 16
  task: graphGeneration

motif:
  motif_loss: true
  motif_output_mode: full_matrix
  motif_cp_table_source: cp_smoothed
  use_syntactic_literal_rules: false
  syntactic_literal_rule_mode: original
  motif_loss_mode: calibrated_gaussian
  motif_temperature_start: 1.0
  motif_temperature_end: 1.0
  motif_temperature_anneal_start_frac: 1.0
  rule_prune: true
  motif_prune_max_values_per_rule: null
  motif_batch_size: 32
  prepare_motif_cache_only: false

loss:
  alpha_kernel_cost: 1.0
  alpha_node_feat: 0.0
  alpha_edge_feat: 0.0
  alpha_motif_loss: 0.1
  alpha_syntactic_literal_motif_loss: 0.1
  alpha_adj_recon: 0.0

runtime:
  run_label: grid-multihop-smoothed-full_matrix-3seed
  graph_save_path: runs/multihop_smoothed_3seed/grid/full_matrix
  dataset_cache_dir: runs/multihop_smoothed_3seed/grid/dataset_cache
  disable_dataset_cache: true
  motif_cache_dir: cache_motifs/multihop_smoothed
  PATH: model
  UseGPU: true
  device: cuda:0
  plot_testGraphs: true
  ideal_Evalaution: false
  keep_best_validation_mmd: true
  best_validation_mmd_metric: table3_priority
  save_validation_checkpoints: false
  checkpoint_interval_epochs: 0
  third_party_eval: true
  third_party_eval_repeats: 10
  third_party_eval_max_graphs: 1000
  third_party_eval_seed: 0
  third_party_eval_device: same
  third_party_eval_structural_features: true
  third_party_eval_json_filename: graph_realism_random_gin.json
  third_party_eval_strict: true
  tiny_overfit: false
  tiny_overfit_size: 32
  interactive: false
  sanity_check: false
  sanity_check_only: false
