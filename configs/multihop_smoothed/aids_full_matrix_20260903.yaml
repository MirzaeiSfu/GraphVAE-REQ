data:
  dataset: AIDS
  use_feature: true
  bfsOrdering: true
  bfs_strategy: all_components
  directed: false
  database_name: aids_undir_feat_multi
  graph_type: homogeneous
  graph_index_start: null
  graph_index_end: null
  data_dir: /project/cs-schulte-lab/ali/GraphVAE-REQ-aids-enzymes-top100-20260714/data_raw
  tu_attribute_bins: 8
  tu_max_nodes: null
  split_mode: paper_70_10_20
  split_seed: 123
  dataset_loader_seed: 123
  train_fraction: 0.7
  val_fraction: 0.1
  seed: 0
  deterministic: true
  deterministic_warn_only: false

model:
  model: GraphVAE
  encoder_type: AvePool
  decoder: FC
  graphEmDim: 1024
  beta: null
  correct_reparameterization: false

experiment:
  epoch_number: 20000
  Vis_step: 1000
  redraw: false
  lr: 0.0003
  train_batch_size: 200
  task: graphGeneration

motif:
  motif_loss: true
  motif_output_mode: full_matrix
  motif_cp_table_source: cp_smoothed
  use_syntactic_literal_rules: false
  syntactic_literal_rule_mode: original
  motif_loss_mode: calibrated_gaussian
  motif_temperature_start: 1.0
  motif_temperature_end: 1.0
  motif_temperature_anneal_start_frac: 1.0
  rule_prune: true
  motif_prune_max_values_per_rule: 256
  motif_batch_size: 50
  prepare_motif_cache_only: false

loss:
  alpha_kernel_cost: 1.0
  alpha_node_feat: 1.0
  alpha_edge_feat: 1.0
  alpha_motif_loss: 0.1
  alpha_syntactic_literal_motif_loss: 0.1
  alpha_adj_recon: 0.0
  use_graphvae_mm_bce_kl_weights: false

runtime:
  run_label: aids-multihop-smoothed-full-matrix-20k
  graph_save_path: /project/cs-schulte-lab/ali/ptc_aids_motif_true_20260903/runs/aids/full_matrix
  dataset_cache_dir: /project/cs-schulte-lab/ali/ptc_aids_motif_true_20260903/dataset_cache
  disable_dataset_cache: false
  require_existing_dataset_cache: false
  motif_cache_dir: /project/cs-schulte-lab/ali/graphvae_motif_cache_20260903/multihop_smoothed
  PATH: model
  UseGPU: true
  device: cuda:0
  plot_testGraphs: true
  ideal_Evalaution: false
  keep_best_validation_mmd: true
  best_validation_mmd_metric: table3_priority
  save_validation_checkpoints: false
  checkpoint_interval_epochs: 1000
  third_party_eval: true
  third_party_eval_repeats: 10
  third_party_eval_max_graphs: 1000
  third_party_eval_seed: 0
  third_party_eval_device: same
  third_party_eval_structural_features: true
  third_party_eval_json_filename: graph_realism_random_gin.json
  third_party_eval_strict: true
  tiny_overfit: false
  tiny_overfit_size: 32
  interactive: false
  sanity_check: false
  sanity_check_only: false
